<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hello">
<title>Hello iPad</title>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #111; color: #fff; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 2rem; margin: 12px 0 4px; text-align: center; }
  .sub { opacity: .7; text-align: center; margin: 0 0 8px; }
  .card { background: #1e1e1e; border-radius: 16px; padding: 20px; margin: 16px 0; text-align: center; }
  .card h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .card p { margin: 8px 0; opacity: .8; }
  .row { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button { font-size: 1.2rem; min-height: 56px; min-width: 88px; padding: 12px 20px; border-radius: 14px; border: 0; background: #fff; color: #111; touch-action: manipulation; }
  button:active { transform: scale(.96); opacity: .8; }
  button.alt { background: #4da3ff; color: #fff; }
  button.ghost { background: #333; color: #fff; }
  button.small { font-size: 1rem; min-height: 44px; margin-top: 8px; }
  #pad { height: 160px; border-radius: 14px; background: #2a2a2a; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; touch-action: none; user-select: none; -webkit-user-select: none; margin-top: 8px; }
  #pad.active { background: #333; border-color: #4da3ff; }
  #count { font-size: 2rem; min-width: 60px; }
  #infos { text-align: left; font-size: .95rem; line-height: 1.7; margin: 8px 0 0; padding-left: 20px; word-break: break-word; }
  .hint { font-size: .85rem; opacity: .6; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="msg">Hello World 👋</h1>
  <p class="sub">iPad mini 4 • Web App • GitHub Pages</p>

  <div class="card">
    <h2>1. Boutons tactiles</h2>
    <p id="tapInfo">0 taps</p>
    <div class="row">
      <button id="btnHello">Toucher</button>
      <button id="btnColor" class="alt">Couleur</button>
      <button id="btnTap" class="ghost">+1 tap</button>
    </div>
  </div>

  <div class="card">
    <h2>2. Zone touch</h2>
    <p>Bouge le doigt ici 👇</p>
    <div id="pad">touche ici 👆</div>
    <p id="padInfo">en attente…</p>
  </div>

  <div class="card">
    <h2>3. Compteur persistant</h2>
    <div class="row">
      <button id="btnMinus">−</button>
      <strong id="count">0</strong>
      <button id="btnPlus">+</button>
    </div>
    <button id="btnReset" class="small ghost">reset</button>
    <p class="hint">Sauvegardé en localStorage.</p>
  </div>

  <div class="card">
    <h2>4. Appareil</h2>
    <ul id="infos"><li>chargement…</li></ul>
  </div>
</div>

<script>
var taps = 0;
var msg = document.getElementById('msg');
var tapInfo = document.getElementById('tapInfo');
var pad = document.getElementById('pad');
var padInfo = document.getElementById('padInfo');
var countEl = document.getElementById('count');
var infosEl = document.getElementById('infos');
var count = 0;
var dark = true;

function bump(n) {
  taps = taps + n;
  tapInfo.textContent = taps + ' taps';
}
document.getElementById('btnHello').onclick = function() {
  msg.textContent = 'Ça marche ! 🎉';
  bump(1);
};
document.getElementById('btnTap').onclick = function() { bump(1); };
document.getElementById('btnColor').onclick = function() {
  dark = !dark;
  document.body.style.background = dark ? '#111' : '#0a4d8c';
  bump(1);
};

// Compteur + localStorage
try { count = parseInt(localStorage.getItem('hello-count') || '0', 10) || 0; } catch (e) {}
function renderCount() {
  countEl.textContent = count;
  try { localStorage.setItem('hello-count', String(count)); } catch (e) {}
}
renderCount();
document.getElementById('btnPlus').onclick = function() { count++; renderCount(); bump(1); };
document.getElementById('btnMinus').onclick = function() { count--; renderCount(); bump(1); };
document.getElementById('btnReset').onclick = function() { count = 0; renderCount(); };

// Zone tactile
function showTouch(type, x, y, n) {
  padInfo.textContent = type + ' • x:' + Math.round(x) + ' y:' + Math.round(y) + ' • ' + n + ' doigt(s)';
}
pad.addEventListener('touchstart', function(e) {
  pad.className = 'active';
  var t = e.touches[0];
  showTouch('touchstart', t.clientX, t.clientY, e.touches.length);
}, false);
pad.addEventListener('touchmove', function(e) {
  if (e.cancelable) { e.preventDefault(); }
  var t = e.touches[0];
  showTouch('touchmove', t.clientX, t.clientY, e.touches.length);
}, { passive: false });
pad.addEventListener('touchend', function(e) {
  pad.className = '';
  padInfo.textContent = 'touchend • ' + e.touches.length + ' doigt(s) restant(s)';
  bump(1);
}, false);
// Fallback souris (test sur Mac)
pad.addEventListener('mousedown', function(e) {
  showTouch('mouse', e.clientX, e.clientY, 1);
});

// Infos appareil
function infos() {
  var w = window.innerWidth, h = window.innerHeight;
  var touch = ('ontouchstart' in window) ? 'oui' : 'non';
  var standalone = (window.navigator.standalone === true) ? 'oui (écran accueil)' : 'non (Safari)';
  var ua = navigator.userAgent;
  if (ua.length > 90) { ua = ua.substring(0, 90) + '…'; }
  infosEl.innerHTML =
    '<li>Écran : ' + w + ' × ' + h + '</li>' +
    '<li>Pixel ratio : ' + (window.devicePixelRatio || '?') + '</li>' +
    '<li>Tactile : ' + touch + '</li>' +
    '<li>Standalone : ' + standalone + '</li>' +
    '<li>UA : ' + ua + '</li>';
}
window.addEventListener('resize', infos);
window.addEventListener('orientationchange', infos);
infos();
</script>
</body>
</html>
