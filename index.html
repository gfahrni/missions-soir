<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hello">
<title>Hello iPad</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#111; color:#fff; }
  .card { text-align:center; padding:32px; }
  h1 { font-size:2.2rem; margin:0 0 8px; }
  p { opacity:.7; margin:0 0 16px; }
  button { font-size:1.2rem; padding:12px 20px; border-radius:12px; border:0; }
</style>
</head>
<body>
<div class="card">
  <h1 id="msg">Hello World 👋</h1>
  <p>iPad mini 4 • Web App • GitHub Pages</p>
  <button onclick="document.getElementById('msg').textContent='Ça marche ! 🎉'">Toucher</button>
</div>
</body>
</html>
