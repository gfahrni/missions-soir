<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missions">
<title>Missions du soir 🌙</title>
<link rel="stylesheet" href="mario-peach-v4.css">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  #topbar { height: calc(48px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); display: flex; align-items: stretch; background: #000; font-size: 1rem; }
  .topzone { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 10px; background: transparent; border: 0; border-radius: 0; color: #fff; font: inherit; font-weight: 600; touch-action: manipulation; }
  .topzone:active { background: rgba(255,255,255,.14); }
  .topzone .pname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topzone .pprog { opacity: .6; font-weight: 400; font-size: .85rem; }
  .timer { -webkit-appearance: none; appearance: none; flex: 0 0 auto; width: 86px; display: flex; align-items: center; justify-content: center; background: #ffe066; color: #5c3d00; border: 0; border-radius: 0; font: inherit; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum"; touch-action: manipulation; }
  .timer:active { filter: brightness(.9); }
  .layout { display: flex; height: calc(100vh - 48px - env(safe-area-inset-top)); height: calc(100dvh - 48px - env(safe-area-inset-top)); }
  .col { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: y mandatory; }
  .col.left { border-right: 2px solid #000; }
  .case { min-height: 100%; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; touch-action: pan-y; }
  .case h2 { font-size: 2.4rem; margin: 0; }
  .case p { margin: 0; opacity: .85; font-size: 1.1rem; }
  .case button { font-size: 1.3rem; min-height: 64px; min-width: 180px; padding: 14px 28px; border-radius: 16px; border: 0; touch-action: manipulation; }
  .case button:active { transform: scale(.95); }
  .case.done { outline: 5px solid #22c55e; outline-offset: -5px; }
  .case { position: relative; }
  .case.done::before { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(110,110,118,.75); }
  .case.done > * { position: relative; z-index: 1; }
  .case.done button { background: #22c55e; color: #fff; border: 2px solid #fff; }
  .star { font-size: 4.5rem; line-height: 1; }
  .star.locked { filter: grayscale(1); opacity: .5; }
  .star.won { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .reset { font-size: 1rem; min-height: 44px; min-width: 0; padding: 8px 16px; border-radius: 12px; background: rgba(0,0,0,.35); color: inherit; border: 2px solid currentColor; }
  .arrow { font-size: 2rem; opacity: .6; }
  .video-case video { width: 100%; max-width: 560px; border-radius: 14px; background: #000; display: block; }
  .vid-controls { display: flex; gap: 16px; }
  .video-case .vid-btn { font-size: 1.5rem; min-height: 56px; min-width: 76px; padding: 8px 18px; border-radius: 14px; border: 0; touch-action: manipulation; }
  .case.gift { background: linear-gradient(180deg, #fff7cc, #f5b301); color: #5c3d00; }
  .gift .card-img { width: 100%; max-width: 420px; border-radius: 14px; background: #fff; display: block; }
  .gift .card-title { font-size: 1.8rem; font-weight: 700; }
  .gift .card-desc { font-size: 1.15rem; }
  .gift .card-id { opacity: .6; font-size: .85rem; }
  #flash { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #fff3bf; opacity: 0; pointer-events: none; z-index: 999; }
  #flash.go { animation: starflash .55s ease; }
  @keyframes starflash { 0% { opacity: 0; } 20% { opacity: .85; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="topbar">
  <button class="timer" id="timer-mario" type="button">20:00</button>
  <button class="topzone" id="top-colL" type="button"></button>
  <button class="topzone" id="top-colR" type="button"></button>
  <button class="timer" id="timer-peach" type="button">20:00</button>
</div>
<div class="layout">
  <div class="col left theme-mario" id="colL"></div>
  <div class="col right theme-peach" id="colR"></div>
</div>
<div id="flash"></div>
<script>
var DEFAULTS = {
  peach: [
    { id: 'toilettes', label: 'Toilettes', emoji: '🚻' },
    { id: 'frimousse', label: 'Frimousse', emoji: '🧼' },
    { id: 'table', label: 'Table', emoji: '🍽️' },
    { id: 'dents', label: 'Dents', emoji: '🪥' },
    { id: 'pyjama', label: 'Pyjama', emoji: '🌙' },
    { id: 'habits', label: 'Habits', emoji: '👕' },
    { id: 'cheveux', label: 'Cheveux', emoji: '💇' }
  ],
  mario: [
    { id: 'toilettes', label: 'Toilettes', emoji: '🚻' },
    { id: 'frimousse', label: 'Frimousse', emoji: '🧼' },
    { id: 'aspirateur', label: 'Aspirateur', emoji: '🧹' },
    { id: 'dents', label: 'Dents', emoji: '🪥' },
    { id: 'pyjama', label: 'Pyjama', emoji: '🌙' },
    { id: 'habits', label: 'Habits', emoji: '👕' },
    { id: 'lunettes', label: 'Lunettes', emoji: '👓' }
  ]
};
// Ordre des colonnes : pour inverser Mario/Peach, il suffit de permuter ces 2 lignes.
var COLS = [
  { id: 'colL', prefix: 'mario', kid: '🍄 Mario' },
  { id: 'colR', prefix: 'peach', kid: '👑 Peach' }
];
function colConfig(prefix) {
  for (var i = 0; i < COLS.length; i++) { if (COLS[i].prefix === prefix) { return COLS[i]; } }
  return { id: 'colL', kid: '👑 Peach' };
}
function missionsFor(prefix) {
  if (window.MISSION_SETS && window.MISSION_SETS[prefix] && window.MISSION_SETS[prefix].length) {
    return window.MISSION_SETS[prefix];
  }
  return DEFAULTS[prefix] || DEFAULTS.peach;
}
var mem = {};
function key(prefix, id) { return 'mario-peach-v1-' + prefix + '-' + id; }
function isDone(prefix, id) {
  try { return localStorage.getItem(key(prefix, id)) === '1'; }
  catch (e) { return mem[key(prefix, id)] === '1'; }
}
function setDone(prefix, id, v) {
  try { localStorage.setItem(key(prefix, id), v ? '1' : '0'); }
  catch (e) { mem[key(prefix, id)] = v ? '1' : '0'; }
}
// Horodatage : chaque clic met à jour l'heure, +1h sans clic = reset auto au chargement
var TIMEOUT_MS = 60 * 60 * 1000; // 1 heure, à ajuster ici
var LS_PREFIX = 'mario-peach-v1-';
var LS_LAST = LS_PREFIX + 'last-click';
function getLast() {
  try { var v = localStorage.getItem(LS_LAST); if (v) { return parseInt(v, 10) || 0; } }
  catch (e) {}
  return parseInt(mem[LS_LAST] || '0', 10) || 0;
}
function touch() {
  var t = Date.now();
  try { localStorage.setItem(LS_LAST, String(t)); }
  catch (e) { mem[LS_LAST] = String(t); }
}
function clearAll() {
  try {
    var rm = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(LS_PREFIX) === 0) { rm.push(k); }
    }
    for (var j = 0; j < rm.length; j++) { localStorage.removeItem(rm[j]); }
  } catch (e) {}
  mem = {};
}
function checkExpiry() {
  if (getLast() && (Date.now() - getLast() > TIMEOUT_MS)) { clearAll(); return true; }
  return false;
}
// Minuteur par joueur : 20 min, non-arretable, popup natif au demarrage.
// Cle sous LS_PREFIX -> efface par clearAll() (reset du soir si >1h sans clic).
var TIMER_MS = 20 * 60 * 1000; // duree du minuteur, a ajuster ici
var TIMER_KEY = LS_PREFIX + 'timer-';
var timerInt = null;
function timerGetEnd(prefix) {
  var k = TIMER_KEY + prefix;
  try { var v = localStorage.getItem(k); if (v) { return parseInt(v, 10) || 0; } }
  catch (e) { return parseInt(mem[k] || '0', 10) || 0; }
  return 0;
}
function timerSetEnd(prefix, end) {
  var k = TIMER_KEY + prefix;
  try { localStorage.setItem(k, String(end)); }
  catch (e) { mem[k] = String(end); }
}
function timerFmt(ms) {
  var s = Math.ceil(ms / 1000);
  if (s < 0) { s = 0; }
  var m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' + r : r);
}
// 4 paliers de 5 min : jaune -> orange clair -> orange fonce -> rouge.
function timerColor(ms) {
  var r = ms / TIMER_MS;
  if (r > 0.75) { return { bg: '#ffe066', fg: '#5c3d00' }; }
  if (r > 0.5) { return { bg: '#ffa94d', fg: '#5c3d00' }; }
  if (r > 0.25) { return { bg: '#f76707', fg: '#ffffff' }; }
  return { bg: '#e03131', fg: '#ffffff' };
}
function timerRender(prefix) {
  var btn = document.getElementById('timer-' + prefix);
  if (!btn) { return; }
  var end = timerGetEnd(prefix);
  var remain = end ? Math.max(0, end - Date.now()) : TIMER_MS;
  var c = timerColor(remain);
  btn.style.background = c.bg;
  btn.style.color = c.fg;
  btn.textContent = timerFmt(remain);
}
function timerTick() {
  var running = false;
  for (var i = 0; i < COLS.length; i++) {
    var prefix = COLS[i].prefix;
    var end = timerGetEnd(prefix);
    timerRender(prefix);
    if (end && end > Date.now()) { running = true; }
  }
  if (running) { if (!timerInt) { timerInt = setInterval(timerTick, 1000); } }
  else if (timerInt) { clearInterval(timerInt); timerInt = null; }
}
function timerClick(prefix) {
  var end = timerGetEnd(prefix);
  if (!end) {
    if (confirm('Démarrer le Timer ?')) {
      timerSetEnd(prefix, Date.now() + TIMER_MS);
      touch();
      timerTick();
    }
    return;
  }
  // Deja lance : ni arret ni redemarrage, meme a 00:00.
}
function timerInit() {
  for (var i = 0; i < COLS.length; i++) {
    (function(prefix) {
      var btn = document.getElementById('timer-' + prefix);
      if (btn) { btn.onclick = function() { timerClick(prefix); }; }
    })(COLS[i].prefix);
  }
  timerTick();
}
function el(tag, cls, text) {
  var d = document.createElement(tag);
  if (cls) { d.className = cls; }
  if (text) { d.textContent = text; }
  return d;
}
// Dégradés auto : start (case 1) -> end (dernière case), étalés sur N cases.
// Pour ajouter des missions, rien à toucher ici ni dans le CSS.
var THEMES = {
  peach: { from: '#ffe3ef', to: '#c2255c', light: '#6b103f', dark: '#ffffff' },
  mario: { from: '#f04038', to: '#711414', light: '#7f1d1d', dark: '#ffffff' }
};
function hexRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function hexByte(v) {
  if (v < 0) { v = 0; } if (v > 255) { v = 255; }
  var s = Math.round(v).toString(16);
  return s.length < 2 ? '0' + s : s;
}
function mixHex(a, b, t) {
  var A = hexRgb(a), B = hexRgb(b);
  return '#' + hexByte(A[0] + (B[0] - A[0]) * t) + hexByte(A[1] + (B[1] - A[1]) * t) + hexByte(A[2] + (B[2] - A[2]) * t);
}
function lumHex(h) {
  var c = hexRgb(h);
  return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
}
function paintColumn(colEl, prefix) {
  var th = THEMES[prefix];
  if (!th) { return; }
  var list = colEl.getElementsByClassName('case');
  var items = [];
  for (var k = 0; k < list.length; k++) {
    if (list[k].className.indexOf('gift') < 0) { items.push(list[k]); }
  }
  for (var i = 0; i < items.length; i++) {
    var top = mixHex(th.from, th.to, i / items.length);
    var bot = mixHex(th.from, th.to, (i + 1) / items.length);
    items[i].style.background = 'linear-gradient(180deg,' + top + ',' + bot + ')';
    items[i].style.color = ((lumHex(top) + lumHex(bot)) / 2 > 0.55) ? th.light : th.dark;
  }
}
// Flash limité à la colonne (jaune pâle = TP étoile, blanc = recommencer)
function flash(colEl, color) {
  var f = document.getElementById('flash');
  if (!f) { return; }
  if (color) { f.style.background = color; }
  if (colEl) {
    var r = colEl.getBoundingClientRect();
    f.style.left = r.left + 'px';
    f.style.top = r.top + 'px';
    f.style.width = r.width + 'px';
    f.style.height = r.height + 'px';
  }
  f.className = '';
  void f.offsetWidth;
  f.className = 'go';
}
// Cadeau 🎁 : 1 carte culture par colonne quand les 2 colonnes sont pleines.
// Journée logique bascule à 4h, slots matin (4h-10h) / midi (10h-16h) / soir (16h-4h).
// Sélection déterministe : hash(date|joueur|slot) dans le pool du thème du jour.
var CULTURE_URL = 'https://gfahrni.github.io/kids-culturecards-ch/';
var CULTURE_IMG = CULTURE_URL + 'images/cartes-500/';
var WEEK_THEME = { 0: 'animaux', 1: 'drapeaux', 2: 'capitales-chefs-lieux', 3: 'montagnes', 4: 'lacs-mers-oceans-rivieres', 5: 'monuments', 6: 'merveilles-et-espace' };
var THEME_LABEL = { 'drapeaux': '🚩 Drapeaux', 'capitales-chefs-lieux': '🏛️ Capitales', 'montagnes': '⛰️ Montagnes', 'lacs-mers-oceans-rivieres': '🌊 Lacs & rivières', 'monuments': '🗿 Monuments', 'merveilles-et-espace': '🚀 Merveilles & espace', 'animaux': '🐾 Animaux' };
function giftInfo() {
  var now = new Date();
  var h = now.getHours();
  var d = (h < 4) ? new Date(now.getTime() - 24 * 3600 * 1000) : now;
  var ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  var slot;
  if (h < 4 || h >= 16) { slot = 'pm'; }
  else if (h < 10) { slot = 'am'; }
  else { slot = 'mid'; }
  return { date: ds, slot: slot, theme: WEEK_THEME[d.getDay()] };
}
function hashStr(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
var CULTURE_DATA = null;
var CULTURE_LOADING = false;
var CULTURE_WAITERS = [];
function cultureLoad(cb) {
  if (CULTURE_DATA) { cb(CULTURE_DATA); return; }
  CULTURE_WAITERS.push(cb);
  if (CULTURE_LOADING) { return; }
  CULTURE_LOADING = true;
  fetch(CULTURE_URL).then(function(r) {
    if (!r.ok) { throw new Error('http ' + r.status); }
    return r.text();
  }).then(function(html) {
    var a = html.indexOf('const DATA =');
    var b = (a < 0) ? -1 : html.indexOf('[', a);
    var c = (b < 0) ? -1 : html.indexOf('const THEMES', b);
    if (b < 0 || c < 0) { throw new Error('parse'); }
    var data = JSON.parse(html.substring(b, c).replace(/;\s*$/, ''));
    CULTURE_DATA = data;
    var w = CULTURE_WAITERS; CULTURE_WAITERS = [];
    for (var i = 0; i < w.length; i++) { w[i](data); }
  }).catch(function() {
    CULTURE_LOADING = false;
    var w = CULTURE_WAITERS; CULTURE_WAITERS = [];
    for (var i = 0; i < w.length; i++) { w[i](null); }
  });
}
// Les 6 tirages du jour (mario|am, mario|mid, mario|pm, peach|am, peach|mid, peach|pm) : tous
// différents, calculés dans un ordre fixe pour rester stables.
function giftCard(pool, dateStr, prefix, slot) {
  if (!pool || !pool.length) { return null; }
  var order = ['mario|am', 'mario|mid', 'mario|pm', 'peach|am', 'peach|mid', 'peach|pm'];
  var me = prefix + '|' + slot;
  var used = {};
  var mine = null;
  for (var k = 0; k < order.length; k++) {
    var idx = hashStr(dateStr + '|' + order[k]) % pool.length;
    var guard = 0;
    while (used[idx] && guard < pool.length) { idx = (idx + 1) % pool.length; guard++; }
    used[idx] = true;
    if (order[k] === me) { mine = pool[idx]; }
  }
  return mine;
}
function slotLabel(slot) {
  if (slot === 'am') { return 'carte du matin ☀️'; }
  if (slot === 'mid') { return 'carte du midi 🌤️'; }
  return 'carte du soir 🌙';
}
function isWonAll() {
  var mp = missionsFor('mario'), pp = missionsFor('peach');
  return countDone('mario') === mp.length && countDone('peach') === pp.length;
}
function refreshGift(prefix) {
  var cfg = colConfig(prefix);
  var col = document.getElementById(cfg.id);
  var star = document.getElementById('star-' + prefix);
  if (!col || !star) { return; }
  var old = document.getElementById('gift-' + prefix);
  if (!isWonAll()) {
    if (old && old.parentNode) { old.parentNode.removeChild(old); }
    return;
  }
  var g = giftInfo();
  if (!old) {
    old = el('div', 'case gift');
    old.id = 'gift-' + prefix;
    if (star.nextSibling) { col.insertBefore(old, star.nextSibling); } else { col.appendChild(old); }
  }
  var gkey = g.date + '|' + g.slot + '|' + prefix;
  if (old._gkey === gkey && old._filled) { return; }
  old._gkey = gkey;
  old._filled = false;
  old.innerHTML = '';
  old.appendChild(el('h2', null, '🎁 Surprise !'));
  old.appendChild(el('p', null, THEME_LABEL[g.theme] + ' • ' + slotLabel(g.slot)));
  old.appendChild(el('p', null, 'Chargement de ta carte... ⏳'));
  cultureLoad(function(data) {
    if (old._gkey !== gkey) { return; }
    if (!data) {
      old.innerHTML = '';
      old.appendChild(el('h2', null, '🎁 Surprise !'));
      old.appendChild(el('p', null, 'Oups, les cartes ne chargent pas 😢'));
      var rb = el('button', null, '↻ Réessayer');
      rb.onclick = function() { old._gkey = ''; old._filled = false; refreshGift(prefix); };
      old.appendChild(rb);
      return;
    }
    var pool = [];
    for (var i = 0; i < data.length; i++) { if (data[i].t === g.theme) { pool.push(data[i]); } }
    pool.sort(function(a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
    var card = giftCard(pool, g.date, prefix, g.slot);
    old.innerHTML = '';
    old.appendChild(el('h2', null, '🎁 Surprise !'));
    old.appendChild(el('p', null, THEME_LABEL[g.theme] + ' • ' + slotLabel(g.slot)));
    if (!card) { old.appendChild(el('p', null, 'Pas de carte aujourd’hui 😢')); return; }
    var img = document.createElement('img');
    img.className = 'card-img';
    img.src = CULTURE_IMG + card.id + '.webp';
    img.alt = card.title;
    img.onload = function() {
      var colEl = document.getElementById(colConfig(prefix).id);
      if (colEl && colEl.scrollHeight - colEl.scrollTop - colEl.clientHeight < 200) {
        colEl.scrollTop = colEl.scrollHeight;
      }
    };
    old.appendChild(img);
    old.appendChild(el('div', 'card-title', card.title));
    old.appendChild(el('p', 'card-desc', card.desc));
    old.appendChild(el('div', 'card-id', card.id));
    old._filled = true;
  });
}
function videoCase(col) {
  var c = el('div', 'case video-case');
  c.appendChild(el('h2', null, '🪥 La vidéo des dents'));
  var v = el('video', 'vid');
  v.src = 'video/tooth_time.mp4';
  v.preload = 'metadata';
  v.setAttribute('playsinline', '');
  v.setAttribute('webkit-playsinline', '');
  c.appendChild(v);
  var bar = el('div', 'vid-controls');
  var play = el('button', 'vid-btn', '▶');
  var reset = el('button', 'vid-btn', '↺');
  play.onclick = function() {
    if (v.paused) { v.play(); } else { v.pause(); }
  };
  reset.onclick = function() {
    v.pause();
    try { v.currentTime = 0; } catch (e) {}
    play.textContent = '▶';
  };
  v.onplay = function() { play.textContent = '⏸'; };
  v.onpause = function() { play.textContent = '▶'; };
  v.onended = function() {
    play.textContent = '▶';
    flash(col, '#fff3bf');
    var target = col._dentsCase;
    if (target) { setTimeout(function() { col.scrollTop = target.offsetTop; }, 150); }
  };
  bar.appendChild(play);
  bar.appendChild(reset);
  c.appendChild(bar);
  c.appendChild(el('div', 'arrow', '↓'));
  if (window.IntersectionObserver) {
    new IntersectionObserver(function(entries) {
      for (var e = 0; e < entries.length; e++) {
        if (!entries[e].isIntersecting) { v.pause(); }
      }
    }, { root: col, threshold: 0.5 }).observe(c);
  }
  return c;
}
function buildColumn(colId, prefix, kid) {
  var col = document.getElementById(colId);
  var missions = missionsFor(prefix);
  col.innerHTML = '';
  for (var i = 0; i < missions.length; i++) {
    if (missions[i].id === 'dents') {
      var vc = videoCase(col);
      vc.setAttribute('data-mission-id', missions[i].id);
      col.appendChild(vc);
    }
    (function(m, idx) {
      var c = el('div', 'case');
      c.setAttribute('data-mission-id', m.id);
      if (m.id === 'dents') { col._dentsCase = c; }
      var done = isDone(prefix, m.id);
      if (done) { c.className = 'case done'; }
      c.appendChild(el('h2', null, m.emoji + ' ' + m.label));
      c.appendChild(el('p', null, kid + ' • Mission n°' + (idx + 1)));
      var b = el('button', null, done ? 'Fait ✅' : 'À faire 👆');
      b.onclick = function() {
        var now = !isDone(prefix, m.id);
        setDone(prefix, m.id, now);
        touch();
        c.className = now ? 'case done' : 'case';
        b.textContent = now ? 'Fait ✅' : 'À faire 👆';
        refreshStars();
        if (now && countDone(prefix) === missions.length) {
          if (isWonAll()) {
            // Les 2 ont fini : TP des 2 colonnes vers étoile + cadeau
            for (var ci = 0; ci < COLS.length; ci++) {
              (function(colId) {
                var colEl = document.getElementById(colId);
                if (!colEl) { return; }
                flash(colEl, '#fff3bf');
                setTimeout(function() { colEl.scrollTop = colEl.scrollHeight; }, 150);
              })(COLS[ci].id);
            }
          } else {
            var s = document.getElementById('star-' + prefix);
            if (s && s.parentNode) {
              var colEl = s.parentNode;
              flash(colEl, '#fff3bf');
              setTimeout(function() { colEl.scrollTop = colEl.scrollHeight; }, 150);
            }
          }
        }
      };
      c.appendChild(b);
      c.appendChild(el('div', 'arrow', '↓'));
      col.appendChild(c);
    })(missions[i], i);
  }
  var s = el('div', 'case');
  s.id = 'star-' + prefix;
  col.appendChild(s);
  var r = el('button', 'reset', '↺ Recommencer');
  r.onclick = function() {
    for (var j = 0; j < missions.length; j++) { setDone(prefix, missions[j].id, false); }
    touch();
    buildColumn(colId, prefix, kid);
    refreshStars();
    var colEl = document.getElementById(colId);
    if (colEl) {
      flash(colEl, '#ffffff');
      setTimeout(function() { colEl.scrollTop = 0; }, 150);
    }
  };
  s.appendChild(r);
  refreshStars();
  paintColumn(col, prefix);
}
function countDone(prefix) {
  var missions = missionsFor(prefix);
  var n = 0;
  for (var j = 0; j < missions.length; j++) { if (isDone(prefix, missions[j].id)) { n++; } }
  return n;
}
function refreshStars() {
  refreshStar('peach');
  refreshStar('mario');
  refreshGift('peach');
  refreshGift('mario');
  updateTopbar();
}
// Résumé par colonne dans la topbar + TP vers la 1re mission non faite.
function updateTopbar() {
  for (var i = 0; i < COLS.length; i++) {
    var cfg = COLS[i];
    var z = document.getElementById('top-' + cfg.id);
    if (!z) { continue; }
    var missions = missionsFor(cfg.prefix);
    z.innerHTML = '';
    z.appendChild(el('span', 'pname', cfg.kid));
    z.appendChild(el('span', 'pprog', countDone(cfg.prefix) + '/' + missions.length));
    z.onclick = (function(prefix) { return function() { gotoNext(prefix); }; })(cfg.prefix);
  }
}
function gotoNext(prefix) {
  var colEl = document.getElementById(colConfig(prefix).id);
  if (!colEl) { return; }
  var missions = missionsFor(prefix);
  var targetId = null;
  for (var i = 0; i < missions.length; i++) {
    if (!isDone(prefix, missions[i].id)) { targetId = missions[i].id; break; }
  }
  if (!targetId) { colEl.scrollTop = colEl.scrollHeight; return; }
  var target = colEl.querySelector('[data-mission-id="' + targetId + '"]');
  if (!target) { return; }
  colEl.scrollTop += target.getBoundingClientRect().top - colEl.getBoundingClientRect().top;
}
function refreshStar(prefix) {
  var missions = missionsFor(prefix);
  var s = document.getElementById('star-' + prefix);
  if (!s) { return; }
  var other = prefix === 'peach' ? 'mario' : 'peach';
  var otherKid = prefix === 'peach' ? 'Mario' : 'Peach';
  var n = countDone(prefix);
  var nOther = countDone(other);
  var mineDone = (n === missions.length);
  var won = mineDone && (nOther === missions.length);
  var waiting = mineDone && !won;
  s.innerHTML = '';
  s.appendChild(el('div', 'star ' + (won ? 'won' : 'locked'), won ? '⭐' : '☆'));
  s.appendChild(el('h2', null, won ? 'Bravo !' : n + ' / ' + missions.length));
  s.appendChild(el('p', null, won ? 'Étoiles gagnées ! 🌟' : (waiting ? 'En attente de ' + otherKid + ' ! 🤝' : 'Finis toutes les missions pour gagner l’étoile')));
  var r = el('button', 'reset', '↺ Recommencer');
  r.onclick = function() {
    for (var k = 0; k < missions.length; k++) { setDone(prefix, missions[k].id, false); }
    touch();
    var colId = colConfig(prefix).id;
    var kid = colConfig(prefix).kid;
    buildColumn(colId, prefix, kid);
    refreshStars();
    var colEl = document.getElementById(colId);
    if (colEl) {
      flash(colEl, '#ffffff');
      setTimeout(function() { colEl.scrollTop = 0; }, 150);
    }
  };
  s.appendChild(r);
  s.appendChild(el('div', 'arrow', '↑'));
}
function buildAll() {
  for (var i = 0; i < COLS.length; i++) {
    buildColumn(COLS[i].id, COLS[i].prefix, COLS[i].kid);
  }
}
checkExpiry();
timerInit();
// Reset du soir fiable meme si l'app est suspendue/reprise sans rechargement.
function onResume() {
  if (checkExpiry()) { buildAll(); }
  timerTick();
}
if (document.addEventListener) {
  document.addEventListener('visibilitychange', function() { if (!document.hidden) { onResume(); } });
}
window.addEventListener('pageshow', onResume);
if (window.fetch) {
  fetch('missions.json').then(function(r) {
    if (!r.ok) { throw new Error('http ' + r.status); }
    return r.json();
  }).then(function(list) {
    if (list && list.peach && list.peach.length && list.mario && list.mario.length) {
      window.MISSION_SETS = list;
    } else if (list && list.length) {
      window.MISSION_SETS = { peach: list, mario: list };
    }
    buildAll();
  }).catch(function() { buildAll(); });
} else {
  buildAll();
}
</script>
</body>
</html>
